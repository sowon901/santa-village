<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산타 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--card:#1d2252;--card2:#2a3070;--line:rgba(255,255,255,.18);--red:#e0454b;--gold:#ffd24a;--green:#2e9e5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12163a;color:var(--ink);font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#snowfall{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}

/* ---- 로딩 ---- */
#loading{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 100%,#6a2f6e 0%,#2a2a6a 38%,#0b0f33 100%);overflow:hidden;transition:opacity 1s ease}
#loading.gone{opacity:0;pointer-events:none}
#stars{position:absolute;inset:0;width:100%;height:100%}
.sleigh{position:absolute;top:22%;left:0;width:min(62vw,620px);filter:drop-shadow(0 0 14px rgba(255,255,255,.55));opacity:.96;animation:fly 5.2s cubic-bezier(.45,.05,.4,1) infinite;will-change:transform}
@keyframes fly{0%{transform:translate(-75vw,40px) rotate(6deg)}50%{transform:translate(18vw,-30px) rotate(-3deg)}100%{transform:translate(110vw,-120px) rotate(-8deg)}}
.ltext{position:absolute;left:0;right:0;bottom:12%;text-align:center}
.ltext h1{margin:0 0 6px;font-size:clamp(34px,6vw,56px);font-weight:400;letter-spacing:.06em;text-shadow:0 0 22px rgba(255,255,255,.55)}
.ltext p{margin:0 0 16px;opacity:.85;font-size:17px}
.barwrap{width:min(280px,64vw);height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto;overflow:hidden}
#bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd24a,#fff);transition:width .6s ease}

/* ---- 시작 패널 ---- */
#start{position:fixed;inset:0;z-index:40;display:flex;align-items:center;pointer-events:none;padding:16px}
#start .panel{pointer-events:auto;width:min(380px,100%);margin-left:max(16px,6vw);background:rgba(20,24,70,.86);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:20px 20px 16px;box-shadow:0 10px 40px rgba(0,0,0,.4);max-height:calc(100dvh - 32px);overflow:auto}
#start h2{margin:0 0 12px;font-weight:400;font-size:24px}
.nick{display:block;font-size:14px;opacity:.9;margin-bottom:6px}
.nick input,.lt input[type=text],.lt input:not([type]),.lt textarea,.owner input{width:100%;margin-top:6px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:17px;outline:none;user-select:text}
.nick input:focus,.lt input:focus,.lt textarea:focus,.owner input:focus{border-color:var(--gold)}
.lt textarea{resize:none;line-height:1.5}
.tip{margin:10px 0 0;font-size:13px;opacity:.7;text-align:center}
@media (max-width:760px){#start{align-items:flex-end}#start .panel{margin:0 auto;max-height:56dvh}}

.costume h4{margin:12px 0 6px;font-weight:400;font-size:14px;opacity:.85}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);font-size:15px}
.chip.on{background:var(--red);border-color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:14px;border:0;background:linear-gradient(180deg,#ee5a60,#c93a41);font-size:17px;box-shadow:0 3px 0 #8f2429}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8f2429}
.btn.big{width:100%;margin-top:16px;padding:14px;font-size:19px}
.btn.small{padding:8px 14px;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:none;border:1.5px solid var(--line)}

/* ---- 상단/하단 HUD ---- */
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:20;pointer-events:none}
#top span{padding:6px 12px;border-radius:99px;background:rgba(20,24,70,.7);backdrop-filter:blur(6px);border:1px solid var(--line);font-size:14px}
#top span:empty{display:none}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:6px;padding:8px;border-radius:24px;background:rgba(20,24,70,.78);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
#hud button{display:flex;flex:0 0 auto;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:8px 6px;border-radius:16px;border:0;background:transparent;font-size:13px;transition:background .15s,transform .1s}
#hud button i{font-style:normal;font-size:26px;line-height:1}
#hud button:hover{background:rgba(255,255,255,.14)}
#hud button.active{background:rgba(255,210,74,.18);color:#ffe9a8}
#hud button:active{transform:scale(.94)}
#hud button.used{opacity:.5}
@media (max-width:520px){#hud{gap:2px;padding:6px}#hud button{min-width:50px;font-size:11px}#hud button i{font-size:23px}}

#place{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 14px;border-radius:18px;background:rgba(20,24,70,.88);border:1px solid var(--gold);max-width:calc(100vw - 20px)}

/* ---- 토스트 ---- */
#toasts{position:fixed;top:60px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:min(340px,calc(100vw - 24px))}
.toast{padding:10px 16px;border-radius:14px;background:rgba(20,24,70,.9);border:1px solid var(--line);font-size:15px;line-height:1.4;animation:tin .3s ease;transition:opacity .4s,transform .4s;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.toast.out{opacity:0;transform:translateX(20px)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@media (max-width:520px){#toasts{top:56px;left:12px;align-items:stretch}}

/* ---- 모달 ---- */
.modal{position:fixed;inset:0;z-index:70;background:rgba(6,8,30,.55);display:flex;align-items:center;justify-content:center;padding:14px;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.card{position:relative;width:min(440px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:linear-gradient(180deg,#252b66,#1b2050);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card.wide{width:min(620px,100%)}
.card h3{margin:0 0 10px;font-weight:400;font-size:22px}
.snowman-picker h4{margin:14px 0 7px;font-size:15px;font-weight:400;opacity:.88}
.card .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:15px}
.sub{margin:4px 0 10px;font-size:14px;opacity:.8;line-height:1.5}
.center{text-align:center;padding:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.grid.emo{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.07);font-size:14px;transition:transform .1s,border-color .15s}
.opt:hover{border-color:rgba(255,255,255,.5)}
.opt:active{transform:scale(.96)}
.opt.on{border-color:var(--gold);background:rgba(255,210,74,.16)}
.opt .em{font-size:32px;line-height:1}
.opt .pap{width:46px;height:46px;border-radius:10px;border:2px solid rgba(255,255,255,.7)}
.opt .rib{width:46px;height:14px;border-radius:99px;border:2px solid rgba(255,255,255,.7);margin:16px 0}

/* 선물 마법사 */
.steps{display:flex;gap:4px;list-style:none;margin:0 0 14px;padding:0 34px 0 0;font-size:12px}
.steps li{flex:1;padding:6px 4px;text-align:center;border-radius:99px;background:rgba(255,255,255,.08);opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.on{background:var(--red);opacity:1}
.steps li.done{background:rgba(46,158,91,.5);opacity:1}
.wiz-body{display:flex;gap:14px;align-items:flex-start}
.pv{flex:0 0 118px;display:flex;justify-content:center;padding-top:6px}
.pane{flex:1;min-width:0}
.pane .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.gp{position:relative;width:104px;height:104px;border-radius:12px;border:2px solid rgba(255,255,255,.65);box-shadow:0 8px 20px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:visible}
.gp em{font-style:normal;font-size:38px;position:relative;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.gp .bv{position:absolute;left:44%;top:0;bottom:0;width:12%;z-index:1}
.gp .bh{position:absolute;top:44%;left:0;right:0;height:12%;z-index:1}
.gp .bow{position:absolute;left:34%;top:-14px;width:32%;height:22px;border-radius:50% 50% 40% 40%;z-index:2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.final{text-align:center;padding:12px 0}
.final p:first-child{font-size:22px;margin:0 0 6px}
.nav{display:flex;justify-content:space-between;margin-top:16px}
@media (max-width:520px){.wiz-body{flex-direction:column;align-items:center}.pv{flex:none}.steps{font-size:11px}}

/* 편지 */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:15px}
.tabs button.on{background:var(--red);border-color:#fff}
.lt label{display:block;font-size:14px;margin-bottom:10px}
.lt .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 4px}
.lt .lock{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;cursor:pointer}
.lt .lock input{width:18px;height:18px;margin:0;accent-color:var(--gold)}
.lt .cnt{font-size:12px;opacity:.65}
.owner{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:14px}
.owner input{margin:0;flex:1}
.letters{display:flex;flex-direction:column;gap:8px;max-height:46dvh;overflow:auto;padding-right:2px}
.letter{padding:12px 14px;border-radius:14px;background:#fff7e0;color:#4a3320;border-left:6px solid var(--red);user-select:text}
.letter p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:15px}
.letter.lockd{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--gold);opacity:.85}
.letter.lockd span{opacity:.6;font-size:13px}

</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="snowfall" aria-hidden="true"></canvas>

<!-- 로딩: 밤하늘 + 산타와 루돌프 썰매가 흰 그림자처럼 지나감 -->
<div id="loading">
  <canvas id="stars"></canvas>
  <svg class="sleigh" viewBox="0 0 760 220" aria-hidden="true">
    <g fill="#fff">
      <!-- 루돌프 -->
      <g transform="translate(40 40)">
        <ellipse cx="86" cy="86" rx="46" ry="22"/>
        <path d="M120 76 L150 44 L162 50 L140 86Z"/>
        <ellipse cx="160" cy="46" rx="17" ry="13"/>
        <circle cx="178" cy="48" r="6"/>
        <path d="M152 36 L146 8 M146 16 L132 6 M156 34 L168 6 M162 14 L176 8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M52 100 L40 134 M64 106 L58 138 M104 106 L112 138 M116 100 L130 130" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" class="legs"/>
      </g>
      <!-- 고삐 -->
      <path d="M215 88 Q300 104 372 130" stroke="#fff" stroke-width="3" fill="none"/>
      <!-- 썰매 -->
      <path d="M350 150 Q350 190 400 192 L560 192 Q600 192 612 150 L560 150 Q540 176 500 176 L420 176 Q390 176 388 150Z"/>
      <path d="M340 196 Q430 214 600 198 Q630 194 640 176" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M395 150 Q400 112 440 106 L560 106 Q600 106 606 150Z"/>
      <!-- 선물 자루 -->
      <path d="M540 108 Q520 50 560 40 Q604 36 612 80 Q618 104 600 108Z"/>
      <!-- 산타 -->
      <circle cx="446" cy="64" r="19"/>
      <path d="M426 56 Q440 10 482 28 Q470 44 466 54Z"/>
      <circle cx="484" cy="28" r="7"/>
      <path d="M430 76 Q446 112 462 78 Q446 90 430 76Z"/>
      <path d="M420 90 Q430 106 450 102 L470 100 Q470 76 450 78Z"/>
    </g>
  </svg>
  <div class="ltext"><h1>산타 마을</h1><p id="loadmsg">별을 켜는 중…</p><div class="barwrap"><div id="bar"></div></div></div>
</div>

<!-- 시작: 닉네임 + 코스튬 (3D 캐릭터를 보면서 선택) -->
<section id="start" hidden>
  <div class="panel">
    <h2>🎅 코스튬을 골라요</h2>
    <label class="nick">닉네임<input id="nick" maxlength="10" placeholder="산타친구" autocomplete="off"></label>
    <div id="start-costume"></div>
    <button class="btn big" id="enter">산타 마을 입장하기 🎄</button>
    <p class="tip">입장 후에도 언제든 코스튬을 바꿀 수 있어요</p>
  </div>
</section>

<!-- 상단 정보 -->
<header id="top"><span id="mode"></span><span id="count"></span><span id="stats"></span></header>

<!-- 하단 메뉴 -->
<nav id="hud" hidden>
  <button data-act="gift"><i>🎁</i>선물 포장</button>
  <button data-act="ornament"><i>🎄</i>오너먼트</button>
  <button data-act="letter"><i>✉️</i>편지</button>
  <button data-act="snowman"><i>⛄</i>눈사람</button>
  <button data-act="costume"><i>👗</i>코스튬</button>
  <button data-act="emote"><i>😀</i>감정</button>
  <button data-act="sleigh"><i>🛷</i>산타 보기</button>
  <button data-act="music" aria-pressed="false" title="배경 음악 켜기/끄기"><i>🎵</i>음악</button>
</nav>

<!-- 오너먼트 배치 안내 -->
<div id="place" hidden>
  <span>🎄 트리를 눌러 걸 위치를 고르세요</span>
  <button class="btn small" id="place-ok" disabled>여기에 달기</button>
  <button class="btn small ghost" id="place-cancel">취소</button>
</div>

<div id="toasts"></div>
<script>
window.addEventListener('error', (event) => {
  console.error('Santa Village script failed to load:', event.message || event);
  const message = document.querySelector('#loadmsg');
  if (message) message.textContent = '화면 스크립트를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
  document.querySelector('#loading')?.classList.add('gone');
  const start = document.querySelector('#start');
  if (start) start.hidden = false;
});
window.addEventListener('unhandledrejection', (event) => {
  console.error('Santa Village startup rejected:', event.reason);
});
</script>
